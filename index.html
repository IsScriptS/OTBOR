<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Технический перерыв</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, system-ui, sans-serif; }

  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(900px 600px at 10% -10%, rgba(120,150,255,.12), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(80,255,200,.06), transparent 55%),
      #080a10;
    color:#eef2fa;
    padding:24px;
  }

  .card {
    width:100%;
    max-width:440px;
    background: linear-gradient(180deg, rgba(26,32,44,.92), rgba(14,18,26,.95));
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:30px 26px;
    text-align:center;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(126,166,255,.08);
  }

  .icon {
    font-size:2.6rem;
    line-height:1;
    margin-bottom:14px;
    filter: drop-shadow(0 0 18px rgba(126,166,255,.5));
  }

  h1 {
    font-size:1.2rem;
    font-weight:800;
    margin-bottom:8px;
    letter-spacing:.3px;
  }

  p {
    font-size:.82rem;
    color:#8a97b0;
    line-height:1.6;
    margin-bottom:22px;
  }
  p b { color:#dbe6ff; }

  .countdown {
    display:flex;
    justify-content:center;
    gap:8px;
  }

  .unit {
    flex:1;
    max-width:96px;
    background:#0b1018;
    border:1px solid #263243;
    border-radius:13px;
    padding:12px 4px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .num {
    font-family: ui-monospace, Consolas, monospace;
    font-size:1.65rem;
    font-weight:700;
    color:#dbe6ff;
    font-variant-numeric: tabular-nums;
    line-height:1;
  }

  .lbl {
    font-size:.58rem;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:#6b7a92;
    font-weight:700;
  }

  .done {
    font-size:1.1rem;
    font-weight:800;
    color:#3ddc97;
  }

  @media (max-width:420px) {
    .num { font-size:1.3rem; }
    .card { padding:24px 18px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🛠️</div>
  <h1>Технический перерыв</h1>
  <p>Мы вернёмся в <b>24:00 по МСК</b>.</p>

  <div class="countdown" id="countdown">
    <div class="unit"><span class="num" id="cdHours">00</span><span class="lbl">часов</span></div>
    <div class="unit"><span class="num" id="cdMinutes">00</span><span class="lbl">минут</span></div>
    <div class="unit"><span class="num" id="cdSeconds">00</span><span class="lbl">секунд</span></div>
  </div>
</div>

<script>
  const H = document.getElementById('cdHours');
  const M = document.getElementById('cdMinutes');
  const S = document.getElementById('cdSeconds');
  const BOX = document.getElementById('countdown');

  // Текущее время по Москве (UTC+3)
  function getMoscowNow() {
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    return new Date(utc + 3 * 3600000);
  }

  // Ближайшие 24:00 по МСК
  function getTargetTime() {
    const msk = getMoscowNow();
    const target = new Date(msk);
    target.setHours(24, 0, 0, 0);
    return target;
  }

  const target = getTargetTime();
  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const diff = target.getTime() - getMoscowNow().getTime();

    if (diff <= 0) {
      clearInterval(timer);
      BOX.innerHTML = '<div class="done">✅ Время вышло</div>';
      return;
    }

    const totalSec = Math.floor(diff / 1000);
    H.textContent = pad(Math.floor(totalSec / 3600));
    M.textContent = pad(Math.floor((totalSec % 3600) / 60));
    S.textContent = pad(totalSec % 60);
  }

  tick();
  const timer = setInterval(tick, 1000);
</script>
</body>
</html>
